<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>並べろ。</title>
<link rel="apple-touch-icon" href="icon.PNG">
<link rel="icon" type="image/png" href="icon.PNG">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="narabero.">
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif}
*{box-sizing:border-box}
body{margin:0;background:#f6f6f6;color:#111}
.wrap{max-width:560px;margin:auto;padding:22px 16px 40px}
h1{font-size:36px;margin:8px 0 2px}
p{margin:5px 0 18px;color:#555}
.card{background:#fff;border-radius:18px;padding:16px;margin:14px 0;box-shadow:0 2px 12px #0000000c}
button{display:block;width:100%;border:0;border-radius:14px;padding:15px;font-weight:700;font-size:17px;text-align:center;background:#111;color:white;margin:10px 0}
.secondary{background:#e9e9e9;color:#111}
.row{display:flex;gap:8px}
.row button{flex:1}
.active{outline:3px solid #999}
#status{font-weight:700;margin-top:10px;white-space:pre-wrap}
canvas{display:block;width:100%;height:auto;background:white;border-radius:10px}
.small{font-size:12px;color:#777}
.hidden{display:none}
#files{width:100%;font-size:16px;padding:12px;border:1px solid #ddd;border-radius:12px;background:#fafafa}
.section-title{font-weight:700;margin-bottom:4px}
</style>
</head>
<body>
<div class="wrap">
<h1>並べろ。</h1>
<p>大量の写真を、黙って並べます。</p>

<div class="card">
  <input id="files" type="file" accept="image/*,.heic,.heif,.jpg,.jpeg,.png,.webp" multiple>
  <button id="pick">📷 写真を選ぶ</button>
  <div id="status">まだ写真はありません</div>
  <div class="small">画像はこの端末内で処理します。外部送信はしません。</div>
</div>

<div class="card">
  <div class="section-title">完成サイズ</div>
  <div class="row">
    <button class="ratio active" data-r="9:16">9:16</button>
    <button class="ratio secondary" data-r="4:5">4:5</button>
    <button class="ratio secondary" data-r="1:1">1:1</button>
  </div>

  <div class="section-title" style="margin-top:14px">並べ方</div>
  <div class="row">
    <button class="mode active" data-mode="contain">全部見せる</button>
    <button class="mode secondary" data-mode="cover">隙間なく切る</button>
  </div>
  <div class="small">「全部見せる」は写真を切らず、元の縦横比のまま敷き詰めます。</div>

  <button id="make">▦ 並べろ。</button>
</div>

<div id="out" class="card hidden">
  <canvas id="canvas"></canvas>
  <button id="save">💾 PNGを保存</button>
  <div id="gridinfo" class="small"></div>
</div>
</div>

<script>
let selected = [];
let ratio = '9:16';
let mode = 'contain';
const $ = s => document.querySelector(s);

function updateFiles() {
  selected = Array.from($('#files').files || []);
  $('#status').textContent = selected.length ? `${selected.length}枚 選択しました` : '選択結果が0枚です';
}

$('#pick').addEventListener('click', () => $('#files').click());
$('#files').addEventListener('input', updateFiles);
$('#files').addEventListener('change', updateFiles);

function setupChoice(selector, onPick) {
  document.querySelectorAll(selector).forEach(b => {
    b.onclick = () => {
      document.querySelectorAll(selector).forEach(x => {
        x.classList.remove('active');
        x.classList.add('secondary');
      });
      b.classList.add('active');
      b.classList.remove('secondary');
      onPick(b);
    };
  });
}
setupChoice('.ratio', b => ratio = b.dataset.r);
setupChoice('.mode', b => mode = b.dataset.mode);

async function fileToBitmap(file) {
  if ('createImageBitmap' in window) {
    try { return await createImageBitmap(file); } catch(e) {}
  }
  const url = URL.createObjectURL(file);
  try {
    const img = new Image();
    img.src = url;
    await img.decode();
    return img;
  } finally {
    setTimeout(() => URL.revokeObjectURL(url), 2000);
  }
}

function bestGrid(n, w, h) {
  let best = null;
  for (let c = 1; c <= n; c++) {
    const r = Math.ceil(n / c);
    const cw = w / c, ch = h / r;
    const area = Math.min(cw, ch) ** 2;
    const empty = r * c - n;
    const score = area - empty * area * .02;
    if (!best || score > best.score) best = {r, c, score};
  }
  return best;
}

function greedyRows(aspects, rowCount) {
  const total = aspects.reduce((a,b)=>a+b,0);
  const target = total / rowCount;
  const rows = [];
  let start = 0;
  let sum = 0;

  for (let i = 0; i < aspects.length; i++) {
    const remainingItems = aspects.length - i;
    const remainingRows = rowCount - rows.length;

    if (rows.length < rowCount - 1 && i > start) {
      const before = Math.abs(sum - target);
      const after = Math.abs(sum + aspects[i] - target);
      const mustBreak = remainingItems === remainingRows;
      if (before <= after || mustBreak) {
        rows.push({start, end:i, sum});
        start = i;
        sum = 0;
      }
    }
    sum += aspects[i];
  }
  rows.push({start, end:aspects.length, sum});
  return rows;
}

function bestJustifiedRows(aspects, W, H) {
  const S = aspects.reduce((a,b)=>a+b,0);
  const ideal = Math.max(1, Math.round(Math.sqrt(S * H / W)));
  let best = null;

  const minRows = Math.max(1, ideal - 4);
  const maxRows = Math.min(aspects.length, ideal + 4);

  for (let k = minRows; k <= maxRows; k++) {
    const rows = greedyRows(aspects, k);
    let totalH = 0;
    let variance = 0;
    const heights = rows.map(r => {
      const rh = W / r.sum;
      totalH += rh;
      return rh;
    });
    const avg = totalH / rows.length;
    heights.forEach(h => variance += (h-avg)*(h-avg));
    const score = Math.abs(totalH - H) + Math.sqrt(variance / rows.length) * 0.12;
    if (!best || score < best.score) best = {rows, heights, totalH, score};
  }
  return best;
}

async function drawContain(ctx, images, W, H) {
  const aspects = images.map(im => im.width / im.height);
  const layout = bestJustifiedRows(aspects, W, H);
  let y = (H - layout.totalH) / 2;

  // 背景は白。余りが出た場合は上下に均等に残す。
  for (let r = 0; r < layout.rows.length; r++) {
    const row = layout.rows[r];
    const rowH = layout.heights[r];
    let x = 0;
    for (let i = row.start; i < row.end; i++) {
      const im = images[i];
      let drawW = rowH * aspects[i];
      // 各行の最後だけ丸め誤差を吸収
      if (i === row.end - 1) drawW = W - x;
      ctx.drawImage(im, x, y, drawW, rowH);
      x += drawW;
    }
    y += rowH;
  }
  return `${images.length}枚 / ${layout.rows.length}段 / 全部見せる / ${W}×${H}px`;
}

async function drawCover(ctx, images, W, H) {
  const g = bestGrid(images.length, W, H);
  const cw = W / g.c, ch = H / g.r;
  for (let i = 0; i < images.length; i++) {
    const im = images[i];
    const iw = im.width, ih = im.height;
    const x = (i % g.c) * cw, y = Math.floor(i / g.c) * ch;
    const scale = Math.max(cw / iw, ch / ih);
    const sw = cw / scale, sh = ch / scale;
    const sx = (iw - sw) / 2, sy = (ih - sh) / 2;
    ctx.drawImage(im, sx, sy, sw, sh, x, y, cw + .5, ch + .5);
  }
  return `${images.length}枚 / ${g.c}列 × ${g.r}行 / 隙間なく切る / ${W}×${H}px`;
}

$('#make').onclick = async () => {
  updateFiles();
  if (!selected.length) {
    alert('写真が0枚です。Safariでこのページを開いて写真を選んでね。');
    return;
  }

  $('#make').textContent = '並べ中…';
  await new Promise(r => setTimeout(r, 20));

  let [rw, rh] = ratio.split(':').map(Number);
  let W = 1080, H = Math.round(W * rh / rw);
  if (H > 1920) { H = 1920; W = Math.round(H * rw / rh); }

  const cv = $('#canvas'), ctx = cv.getContext('2d');
  cv.width = W; cv.height = H;
  ctx.fillStyle = '#fff';
  ctx.fillRect(0, 0, W, H);

  const images = [];
  try {
    for (let i = 0; i < selected.length; i++) {
      $('#make').textContent = `読み込み中… ${i+1}/${selected.length}`;
      images.push(await fileToBitmap(selected[i]));
    }

    $('#make').textContent = '並べ中…';
    let info;
    if (mode === 'contain') info = await drawContain(ctx, images, W, H);
    else info = await drawCover(ctx, images, W, H);

    $('#gridinfo').textContent = info;
    $('#out').classList.remove('hidden');
    $('#out').scrollIntoView({behavior:'smooth'});
  } catch (e) {
    console.error(e);
    alert('画像の読み込み中にエラーが出ました。枚数を減らして試してみてね。');
  } finally {
    images.forEach(im => { if (im && im.close) im.close(); });
    $('#make').textContent = '▦ 並べろ。';
  }
};

$('#save').onclick = () => {
  $('#canvas').toBlob(blob => {
    if (!blob) return alert('保存用画像を作れませんでした');
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `narabero_${Date.now()}.png`;
    a.click();
    setTimeout(() => URL.revokeObjectURL(url), 2000);
  }, 'image/png');
};
</script>
</body>
</html>
